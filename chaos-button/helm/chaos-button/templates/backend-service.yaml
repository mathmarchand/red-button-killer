apiVersion: v1
kind: Service
metadata:
  name: {{ include "chaos-button.fullname" . }}-backend
  labels:
    {{- include "chaos-button.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Deliberately not externally exposed: the frontend's nginx proxies
  # "/api/*" to this Service from inside the cluster.
  type: {{ .Values.service.backend.type }}
  selector:
    app.kubernetes.io/name: {{ include "chaos-button.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backend.port }}
      targetPort: http
