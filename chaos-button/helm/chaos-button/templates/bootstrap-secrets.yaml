{{- range .Values.resources }}
---
apiVersion: v1
kind: Secret
metadata:
  name: chaos-res-{{ .name | lower | replace " " "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: chaos-button
    chaos-button/resource: "true"
    chaos-button/type: {{ .type }}
  annotations:
    chaos-button/display-name: {{ .name | quote }}
type: Opaque
stringData:
{{- if eq .type "maas" }}
  type: maas
  name: {{ .name | quote }}
  url: {{ .url | quote }}
  oauth_key: {{ .oauthKey | quote }}
  system_id: {{ .systemId | quote }}
{{- else if eq .type "k8s_pod" }}
  type: k8s_pod
  name: {{ .name | quote }}
  namespace: {{ .namespace | quote }}
  pod_name: {{ .podName | quote }}
  kubeconfig: |
{{ .kubeconfig | indent 4 }}
{{- end }}
{{- end }}
