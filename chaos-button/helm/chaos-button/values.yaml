nameOverride: ""
fullnameOverride: ""

image:
  registry: ""     # e.g. "myregistry.example.com/"  (include trailing slash)
  backend:
    repository: chaos-button-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: chaos-button-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  port: 8080
  logLevel: INFO
  resources: {}
  # resources:
  #   limits:
  #     cpu: 200m
  #     memory: 256Mi
  #   requests:
  #     cpu: 50m
  #     memory: 64Mi

frontend:
  replicaCount: 1
  port: 8080
  resources: {}

# The frontend is the single external entry point: its nginx proxies
# "/api/*" to the backend's ClusterIP Service internally, so only the
# frontend needs to be reachable from outside the cluster. On clusters
# without a cloud load-balancer (e.g. kind/minikube without MetalLB),
# the frontend's EXTERNAL-IP will stay <pending> - use `kubectl port-forward`
# or `minikube tunnel` as a fallback (see the NOTES after install).
service:
  backend:
    type: ClusterIP
    port: 8080
  frontend:
    type: LoadBalancer
    port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Optionally bootstrap resources at install time. Each entry becomes a
# Kubernetes Secret, exactly as if it had been created through the API.
# These can still be deleted/re-created later through the Big Red Button UI.
#
# resources:
#   - type: maas
#     name: rack-server-1
#     url: http://maas.example.com:5240/MAAS
#     oauthKey: "consumerKey:tokenKey:tokenSecret"
#     systemId: abc123
#   - type: k8s_pod
#     name: payments-worker
#     namespace: payments
#     podName: payments-worker-xyz
#     kubeconfig: |
#       apiVersion: v1
#       clusters:
#         - cluster:
#             server: https://example-cluster:6443
#           name: example
#       ...
resources: []
