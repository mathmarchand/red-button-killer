apiVersion: v2
name: chaos-button
description: >
  A chaos-engineering "Big Red Button" application. Register MAAS machines
  or Kubernetes pods as resources, then press the button to kill one at
  random (power off the MAAS machine, or delete the pod via its kubeconfig).
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - chaos-engineering
  - maas
  - kubernetes
